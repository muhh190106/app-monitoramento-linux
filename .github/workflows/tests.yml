name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  storage:
    name: Storage / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install storage and time zone support
        run: python -m pip install '.[storage]'
      - name: Test migrations, persistence and queries
        run: python -m unittest discover -s tests -p test_storage.py -v

  contracts:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract validation tools
        run: python -m pip install '.[contracts]'
      - name: Validate API specification and payload examples
        run: python -m unittest discover -s tests -p test_contract.py -v

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify the installed command
        run: |
          python -m pip install .
          activity-monitor --version
          activity-monitor --demo

  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install '.[desktop]'
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a env STIME_DESKTOP_TESTS=1 python -m unittest discover -s tests -v
      - name: Test desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STIME_DESKTOP_TESTS = '1'
          python -m unittest discover -s tests -v

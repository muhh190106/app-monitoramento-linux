name: Relatar problema
description: Informe um problema reproduzível usando dados fictícios.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Você pode escrever em português ou inglês. Não inclua atividade pessoal, credenciais ou caminhos privados. Para vulnerabilidades, consulte SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operacional, versão do Python e commit ou versão do projeto.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Inclua comandos e um exemplo mínimo com dados fictícios.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtido
      description: Inclua mensagens de erro sem informações sensíveis, se necessário.
    validations:
      required: true

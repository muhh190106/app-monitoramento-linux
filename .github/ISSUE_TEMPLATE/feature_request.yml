name: Feature request
description: Propose an improvement to Activity Monitor.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior, alternatives, and any privacy implications.
    validations:
      required: true

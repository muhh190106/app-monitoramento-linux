name: Sugerir melhoria
description: Proponha uma melhoria para o STime NOW, em português ou inglês.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema a resolver
      description: Quem é afetado e o que essa pessoa precisa fazer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Explique o comportamento, as alternativas e os impactos na privacidade.
    validations:
      required: true
